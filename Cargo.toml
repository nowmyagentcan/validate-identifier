[package]
name = "validate-identifier"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Check IBANs, VAT numbers, phone numbers, emails, LEIs and Peppol IDs, offline or against the official registries"
repository = "https://github.com/nowmyagentcan/validate-identifier"
publish = false

[dependencies]
anstream = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
iban_validation_rs = "=0.1.30"
idna = "1.1.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
ring = { version = "0.17.14", default-features = false }
roxmltree = "0.21.2"
rlibphonenumber = { version = "=2.2.15", default-features = false, features = ["global_static", "lite", "protox"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", default-features = false, features = ["rt"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
